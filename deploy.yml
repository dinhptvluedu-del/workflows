name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Hoặc master tùy thuộc vào tên branch chính của bạn

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Truyền API Key từ Secrets vào lúc build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Thư mục chứa code sau khi build (Vite thường là 'dist', có thể thay bằng 'build' nếu dùng CRA)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
